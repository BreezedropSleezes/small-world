<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">居民智能结构图</title>
  <desc id="desc">左侧为居民决策循环：目标、处境、评估、执行、反思、反馈，再返回目标。右侧为决策上下文：角色设定、能力列表、工具列表和游戏系统，汇总为系统提示词并输入个体。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1b1a17"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b84a26"/>
    </marker>
    <style>
      .box { fill: #fbfaf7; stroke: #1b1a17; stroke-width: 1.2; }
      .soft { fill: #fbfaf7; stroke: #b7aea0; stroke-width: 1; }
      .dash { fill: #fbfaf7; stroke: #8c8579; stroke-width: 1.1; stroke-dasharray: 4 3; }
      .title { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 24px; font-weight: 600; fill: #1b1a17; }
      .body { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 16px; fill: #6f6a60; }
      .small { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; fill: #6f6a60; }
      .label { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; fill: #6f6a60; letter-spacing: 1px; }
      .accent-label { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; fill: #b84a26; }
      .arrow { fill: none; stroke: #1b1a17; stroke-width: 1.2; }
      .accent { fill: none; stroke: #b84a26; stroke-width: 1.3; }
      .assembly { fill: #fbfaf7; stroke: #b84a26; stroke-width: 1.3; }
    </style>
  </defs>

  <!-- Left: individual decision loop -->
  <text class="label" x="210" y="45">个体决策循环</text>

  <rect class="box" x="210" y="70" width="220" height="58" rx="2"/>
  <text class="title" x="320" y="95" text-anchor="middle">目标</text>
  <text class="body" x="320" y="116" text-anchor="middle">当前主任务</text>

  <rect class="box" x="210" y="160" width="220" height="58" rx="2"/>
  <text class="title" x="320" y="185" text-anchor="middle">个体 / 处境</text>
  <text class="body" x="320" y="206" text-anchor="middle">能力、记忆、物品、环境</text>

  <rect class="box" x="210" y="250" width="220" height="58" rx="2"/>
  <text class="title" x="320" y="275" text-anchor="middle">评估 / 下一步</text>
  <text class="body" x="320" y="296" text-anchor="middle">选择可行的下一步</text>

  <rect class="box" x="210" y="340" width="220" height="58" rx="2"/>
  <text class="title" x="320" y="365" text-anchor="middle">执行</text>
  <text class="body" x="320" y="386" text-anchor="middle">行为配方与动作</text>

  <rect class="box" x="210" y="430" width="220" height="58" rx="2"/>
  <text class="title" x="320" y="455" text-anchor="middle">反思</text>
  <text class="body" x="320" y="476" text-anchor="middle">调整方法或放弃</text>

  <rect class="box" x="210" y="520" width="220" height="58" rx="2"/>
  <text class="title" x="320" y="545" text-anchor="middle">反馈</text>
  <text class="body" x="320" y="566" text-anchor="middle">更新任务进度</text>

  <path class="arrow" d="M320 128 L320 158" marker-end="url(#arrow)"/>
  <path class="arrow" d="M320 218 L320 248" marker-end="url(#arrow)"/>
  <path class="arrow" d="M320 308 L320 338" marker-end="url(#arrow)"/>
  <path class="arrow" d="M320 398 L320 428" marker-end="url(#arrow)"/>
  <path class="arrow" d="M320 488 L320 518" marker-end="url(#arrow)"/>

  <path class="arrow" d="M210 549 L110 549 L110 99 L206 99" marker-end="url(#arrow)"/>
  <text class="small" x="100" y="330" text-anchor="middle" transform="rotate(-90 100 330)">目标是否完成？</text>

  <!-- Right: decision context -->
  <text class="label" x="680" y="45">决策上下文</text>

  <rect class="soft" x="680" y="70" width="460" height="70" rx="2"/>
  <text class="title" x="700" y="100">角色设定</text>
  <text class="body" x="700" y="122">身份、偏好与行为边界</text>

  <rect class="soft" x="680" y="155" width="460" height="130" rx="2"/>
  <text class="title" x="700" y="185">能力列表</text>

  <rect class="dash" x="700" y="200" width="100" height="60" rx="2"/>
  <text class="title" x="750" y="222" text-anchor="middle" font-size="17">感知</text>
  <text class="small" x="750" y="240" text-anchor="middle">寻找 / 观察</text>
  <text class="small" x="750" y="254" text-anchor="middle">未接入</text>

  <rect class="soft" x="810" y="200" width="100" height="60" rx="2"/>
  <text class="title" x="860" y="222" text-anchor="middle" font-size="17">交互</text>
  <text class="small" x="860" y="240" text-anchor="middle">砍伐 / 采集</text>
  <text class="small" x="860" y="254" text-anchor="middle">挖掘</text>

  <rect class="soft" x="920" y="200" width="100" height="60" rx="2"/>
  <text class="title" x="970" y="222" text-anchor="middle" font-size="17">系统</text>
  <text class="small" x="970" y="240" text-anchor="middle">建造 / 制造</text>
  <text class="small" x="970" y="254" text-anchor="middle">种植</text>

  <rect class="soft" x="1030" y="200" width="100" height="60" rx="2"/>
  <text class="title" x="1080" y="222" text-anchor="middle" font-size="17">基础</text>
  <text class="small" x="1080" y="240" text-anchor="middle">移动 / 搬运</text>
  <text class="small" x="1080" y="254" text-anchor="middle">存放</text>

  <rect class="soft" x="680" y="300" width="460" height="105" rx="2"/>
  <text class="title" x="700" y="330">工具列表</text>
  <rect class="soft" x="700" y="345" width="76" height="40" rx="2"/>
  <text class="title" x="738" y="370" text-anchor="middle" font-size="15">感知</text>
  <rect class="soft" x="786" y="345" width="76" height="40" rx="2"/>
  <text class="title" x="824" y="370" text-anchor="middle" font-size="15">计划</text>
  <rect class="soft" x="872" y="345" width="76" height="40" rx="2"/>
  <text class="title" x="910" y="370" text-anchor="middle" font-size="15">任务</text>
  <rect class="soft" x="958" y="345" width="76" height="40" rx="2"/>
  <text class="title" x="996" y="370" text-anchor="middle" font-size="15">反思</text>
  <rect class="soft" x="1044" y="345" width="76" height="40" rx="2"/>
  <text class="title" x="1082" y="370" text-anchor="middle" font-size="15">更新</text>

  <rect class="soft" x="680" y="420" width="460" height="130" rx="2"/>
  <text class="title" x="700" y="450">游戏系统</text>

  <rect class="soft" x="700" y="465" width="100" height="65" rx="2"/>
  <text class="title" x="750" y="490" text-anchor="middle" font-size="17">种植</text>
  <text class="small" x="750" y="510" text-anchor="middle">清单 + 机制</text>

  <rect class="soft" x="810" y="465" width="100" height="65" rx="2"/>
  <text class="title" x="860" y="490" text-anchor="middle" font-size="17">建造</text>
  <text class="small" x="860" y="510" text-anchor="middle">清单 + 机制</text>

  <rect class="soft" x="920" y="465" width="100" height="65" rx="2"/>
  <text class="title" x="970" y="490" text-anchor="middle" font-size="17">制造</text>
  <text class="small" x="970" y="510" text-anchor="middle">清单 + 机制</text>

  <rect class="dash" x="1030" y="465" width="100" height="65" rx="2"/>
  <text class="title" x="1080" y="490" text-anchor="middle" font-size="17">待拓展</text>
  <text class="small" x="1080" y="510" text-anchor="middle">尚未接入</text>

  <path class="arrow" d="M910 550 L910 588" marker-end="url(#arrow)"/>
  <text class="small" x="925" y="575">汇总</text>

  <rect class="assembly" x="800" y="590" width="220" height="50" rx="2"/>
  <text class="title" x="910" y="621" text-anchor="middle" font-size="18">系统提示词组装</text>

  <path class="accent" d="M800 615 L640 615 L640 189 L434 189" marker-end="url(#arrow-accent)"/>
  <text class="accent-label" x="650" y="400" text-anchor="middle" transform="rotate(-90 650 400)">喂给个体 / 处境</text>

  <!-- Legend -->
  <line class="arrow" x1="40" y1="700" x2="86" y2="700"/>
  <text class="small" x="94" y="704">已接入</text>
  <line class="dash" x1="170" y1="700" x2="216" y2="700"/>
  <text class="small" x="224" y="704">尚未接入</text>
  <line class="accent" x1="340" y1="700" x2="386" y2="700"/>
  <text class="small" x="394" y="704">决策上下文输入</text>
</svg>
